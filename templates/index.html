<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数学错题工作台</title>
  <link rel="icon" href="/static/icons/notebook-pen.svg" type="image/svg+xml">
  <script>
    (() => {
      const savedTheme = localStorage.getItem("math-dashboard-theme");
      const theme = savedTheme || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.dataset.theme = theme;
      const savedAppearance = localStorage.getItem("math-dashboard-appearance");
      document.documentElement.dataset.appearance = savedAppearance === "glass" ? "glass" : "matte";
    })();
  </script>
  <link rel="stylesheet" href="/static/css/app.css?v=20261008-backlog-page-sort">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <nav class="nav" aria-label="主导航">
        <button class="nav-item active" data-target="overview"><img class="icon" src="/static/icons/panels-top-left.svg" alt=""><span>总览</span></button>
        <button class="nav-item" data-target="review"><img class="icon" src="/static/icons/rotate-ccw.svg" alt=""><span>回滚复习</span></button>
        <button class="nav-item" data-target="errors"><img class="icon" src="/static/icons/notebook-pen.svg" alt=""><span>错题记录</span></button>
        <button class="nav-item" data-target="graduate"><img class="icon" src="/static/icons/graduation-cap.svg" alt=""><span>毕业题库</span></button>
      </nav>

      <div class="book-panel">
        <label for="bookSelect">题册</label>
        <select id="bookSelect"></select>
        <div class="book-meta" id="bookMeta">正在读取记录</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="page-heading">
          <h2 id="pageTitle">总览</h2>
          <span id="pageDate"></span>
        </div>
        <div class="topbar-actions">
          <label class="appearance-picker" id="appearancePicker">
            <span>主题</span>
            <select id="appearanceSelect" aria-label="界面主题">
              <option value="matte">暖米色</option>
              <option value="glass">液态玻璃</option>
            </select>
          </label>
          <button class="theme-toggle" id="themeToggle" type="button" aria-pressed="false" title="切换深色模式">
            <img class="icon" id="themeToggleIcon" src="/static/icons/moon.svg" alt="">
            <span class="sr-only" id="themeToggleLabel">深色</span>
          </button>
          <button class="git-commit-action" id="publicRefreshButton" type="button" title="更新公开副本">
            <img class="icon" src="/static/icons/refresh-cw.svg" alt="">
            <span>更新公开副本</span>
          </button>
          <button class="git-commit-action" id="gitPullButton" type="button">
            <img class="icon" src="/static/icons/refresh-cw.svg" alt="">
            <span id="gitPullButtonLabel">拉取记录</span>
          </button>
          <button class="git-commit-action" id="gitCommitButton" type="button" hidden>
            <img class="icon" src="/static/icons/save.svg" alt="">
            <span id="gitCommitButtonLabel">提交记录</span>
          </button>
          <div class="status-pill" id="dataStatus">加载中</div>
        </div>
      </header>

      <section class="view active" id="overviewView">
        <div class="metrics-grid">
          <article class="metric">
            <span>总记录</span>
            <strong id="totalRecords">-</strong>
          </article>
          <article class="metric">
            <span>题册记录</span>
            <strong id="bookRecords">-</strong>
          </article>
          <article class="metric">
            <span>ABC 错题</span>
            <strong id="errorTotal">-</strong>
          </article>
          <article class="metric">
            <span>平均掌握度</span>
            <strong id="avgMastery">-</strong>
          </article>
        </div>

        <div class="overview-grid">
          <section class="panel">
            <div class="panel-head">
              <h3>ABC 分布</h3>
              <span id="abcSourceMeta">以 MD 索引为准</span>
            </div>
            <div class="abc-chart" id="abcChart"></div>
          </section>

          <section class="panel">
            <div class="panel-head">
              <h3>单元初始正确率</h3>
              <span>仅首次记录</span>
            </div>
            <div class="trend-chart" id="trendChart"></div>
          </section>
        </div>

        <div class="overview-grid bottom">
          <section class="panel">
            <div class="panel-head">
              <h3>高频错因</h3>
              <span>error_tags</span>
            </div>
            <div id="errorTags" class="rank-list"></div>
          </section>

          <section class="panel">
            <div class="panel-head">
              <h3>薄弱点</h3>
              <span>weakness_focus</span>
            </div>
            <div id="weaknessFocus" class="rank-list"></div>
          </section>
        </div>

        <section class="panel">
          <div class="panel-head">
            <h3>单元覆盖</h3>
            <span>覆盖文档摘要</span>
          </div>
          <div class="coverage-list" id="coverageList"></div>
        </section>
      </section>

      <section class="view" id="reviewView">
        <div class="git-commit-notice" id="gitCommitNotice" role="status" aria-live="polite" hidden></div>

        <div class="review-overview">
          <section class="review-summary" aria-label="今日复盘统计">
            <div class="review-metrics">
              <article class="mini-metric">
                <span>应复盘</span>
                <strong id="reviewDue">-</strong>
              </article>
              <article class="mini-metric">
                <span>待复盘</span>
                <strong id="reviewSelected">-</strong>
              </article>
              <article class="mini-metric">
                <span>超出上限</span>
                <strong id="reviewOverflow">-</strong>
              </article>
              <label class="mini-metric limit-metric" for="dailyLimit">
                <span>每日上限</span>
                <input id="dailyLimit" type="number" min="1" max="200" value="20">
              </label>
            </div>
            <details class="tier-breakdown">
              <summary>按题册与分层</summary>
              <div class="tier-ledger" id="reviewTierCounts"></div>
            </details>
          </section>

          <section class="activity-panel" aria-label="复盘活跃">
            <div class="panel-head">
              <h3>复盘活跃</h3>
              <span id="activityMeta">近 16 周</span>
            </div>
            <div class="activity-heatmap" id="reviewActivity"></div>
            <div class="heat-legend" aria-label="完成比例：少到全部完成">
              <span>少</span><i class="heat-cell"></i><i class="heat-cell heat-1"></i><i class="heat-cell heat-2"></i><i class="heat-cell heat-3"></i><i class="heat-cell heat-4"></i><span>全部完成</span>
            </div>
          </section>
        </div>

        <div class="review-controls">
          <div class="tier-filter-groups" id="reviewTierFilters" aria-label="按题册选择目标分层"></div>
          <button class="icon-button" id="refreshReview" type="button" title="刷新队列" aria-label="刷新队列"><img class="icon" src="/static/icons/refresh-cw.svg" alt=""></button>
        </div>

        <div class="review-columns">
          <details class="queue-section" id="dailyQueuePanel" open>
            <summary class="queue-heading"><h3>今日队列</h3><span id="dailyQueueCount">0</span></summary>
            <div class="queue-panel">
              <div class="queue-toolbar">
                <span class="queue-meta" id="reviewTodayMeta">等待读取</span>
                <button class="secondary-action" id="moveAllToBacklog" type="button"><img class="icon" src="/static/icons/arrow-right.svg" alt="">剩余移入遗留</button>
              </div>
              <div id="reviewQueue" class="review-list"></div>
            </div>
          </details>
          <details class="queue-section" id="backlogQueuePanel" open>
            <summary class="queue-heading"><h3>遗留队列</h3><span id="backlogQueueCount">0</span></summary>
            <div class="queue-panel">
              <div class="queue-toolbar">
                <span class="queue-meta" id="reviewBacklogMeta">暂存 0 题</span>
                <div class="queue-toolbar-actions">
                  <button class="secondary-action sort-backlog-button" id="sortBacklogByPage" type="button" aria-pressed="false" title="按页码降序排列，再点一次恢复原顺序；880 在前，660 按题号降序"><img class="icon" src="/static/icons/arrow-down-wide-narrow.svg" alt="">页码降序</button>
                  <button class="secondary-action" id="moveYesterdayToBacklog" type="button" title="检查昨日排期，将未完成题移入遗留队列"><img class="icon" src="/static/icons/arrow-right.svg" alt="">昨日剩余移入遗留</button>
                </div>
              </div>
              <div id="reviewBacklog" class="review-list"></div>
            </div>
          </details>
        </div>

        <section class="panel review-history-panel">
          <div class="panel-head">
            <h3>复盘记录</h3>
            <span id="reviewHistoryTotal">累计复盘 0 题</span>
          </div>
          <div id="reviewHistory" class="history-list"></div>
        </section>
      </section>

      <section class="view" id="graduateView">
        <section class="panel graduated-panel">
          <div class="panel-head">
            <h3>毕业题库</h3>
            <span id="reviewGraduatedMeta">60 天低频维护 · 0 题</span>
          </div>
          <div id="reviewGraduated" class="graduated-list"></div>
        </section>
      </section>

      <section class="view" id="errorsView">
        <section class="panel">
          <div class="panel-head">
            <h3>错题记录</h3>
            <span id="errorViewMeta">按单元与 ABC 分级查看</span>
          </div>
          <div class="error-filter-bar" id="errorFilters" hidden></div>
          <div class="level-tabs" id="levelTabs">
            <button class="tab active" data-level="all">全部</button>
            <button class="tab" data-level="A">A 级</button>
            <button class="tab" data-level="B">B 级</button>
            <button class="tab" data-level="C">C 级</button>
          </div>
          <div id="errorList" class="error-list"></div>
        </section>
      </section>

    </main>
  </div>

  <script src="/static/js/app.js?v=20261010-public-refresh"></script>
</body>
</html>
